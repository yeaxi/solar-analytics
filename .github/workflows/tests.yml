name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest ruff mypy

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format)
        run: ruff format --check .

      - name: Mypy (strict, pure modules)
        run: mypy

      - name: Byte-compile
        run: python -m compileall -q custom_components/solar_analytics tools scripts

      - name: Pytest (fast suite)
        run: python -m pytest -q

  integration:
    name: Integration tests (pytest-homeassistant-custom-component)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install integration dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-homeassistant-custom-component

      - name: Pytest (Home Assistant integration suite)
        run: python -m pytest tests/hass_integration/ --override-ini="addopts="
