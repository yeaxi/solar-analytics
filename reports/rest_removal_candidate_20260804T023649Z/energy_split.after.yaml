# Battery ledger: only deltas after initialization are priced. PV charge is zero-cost;
# grid charge is priced at the tariff active during the interval.
automation:
  - id: energy_battery_ledger_update
    alias: Energy battery weighted cost ledger update
    mode: queued
    max: 2
    trigger:
      - platform: time_pattern
        minutes: '/1'
    condition:
      - condition: template
        value_template: >-
          {{ states('sensor.cerbo_gx_dc_battery_charge_energy') not in ['unknown','unavailable','none']
             and states('sensor.cerbo_gx_dc_battery_discharge_energy') not in ['unknown','unavailable','none']
             and states('select.energy_grid_day_night') in ['day','night'] }}
    action:
      - variables:
          charge_now: "{{ states('sensor.cerbo_gx_dc_battery_charge_energy') | float(0) }}"
          discharge_now: "{{ states('sensor.cerbo_gx_dc_battery_discharge_energy') | float(0) }}"
          previous_charge: "{{ states('input_number.energy_battery_ledger_last_charge') | float(0) }}"
          previous_discharge: "{{ states('input_number.energy_battery_ledger_last_discharge') | float(0) }}"
          delta_charge: "{{ [charge_now|float(0) - previous_charge|float(0), 0] | max }}"
          delta_discharge: "{{ [discharge_now|float(0) - previous_discharge|float(0), 0] | max }}"
          stock_kwh: "{{ states('input_number.energy_battery_ledger_stock_kwh') | float(0) }}"
          stock_cost: "{{ states('input_number.energy_battery_ledger_stock_cost') | float(0) }}"
          tariff: >-
            {{ states('input_number.energy_grid_day_tariff') | float(0) if is_state('select.energy_grid_day_night','day')
               else states('input_number.energy_grid_night_tariff') | float(0) }}
          homes_power: "{{ states('sensor.energy_total_homes_power') | float(0) }}"
          grid_charge_power: "{{ states('sensor.energy_grid_to_battery_power') | float(0) }}"
          pv_charge_power: "{{ states('sensor.energy_pv_to_battery_power') | float(0) }}"
          generator_charge_power: "{{ states('sensor.energy_generator_to_battery_power') | float(0) }}"
          battery_charge_power: "{{ states('sensor.energy_battery_charge_power') | float(0) }}"
          grid_charge_share: >-
            {% set charge = battery_charge_power|float(0) %}
            {% if charge > 0 %}{{ [[grid_charge_power|float(0) / charge, 1] | min, 0] | max }}{% else %}0{% endif %}
          charge_efficiency: "{{ [states('input_number.energy_battery_ledger_charge_efficiency')|float(90) / 100, 0.01] | max }}"
          discharge_efficiency: "{{ [states('input_number.energy_battery_ledger_discharge_efficiency')|float(90) / 100, 0.01] | max }}"
      - choose:
          - conditions:
              - condition: template
                value_template: >-
                  {{ charge_now|float(0) < previous_charge|float(0)
                     or discharge_now|float(0) < previous_discharge|float(0) }}
            sequence:
              - action: input_number.set_value
                target: {entity_id: input_number.energy_battery_ledger_last_charge}
                data: {value: "{{ charge_now|float(0) }}"}
              - action: input_number.set_value
                target: {entity_id: input_number.energy_battery_ledger_last_discharge}
                data: {value: "{{ discharge_now|float(0) }}"}
        default:
          - action: input_number.set_value
            target: {entity_id: input_number.energy_battery_ledger_last_charge}
            data: {value: "{{ charge_now|float(0) }}"}
          - action: input_number.set_value
            target: {entity_id: input_number.energy_battery_ledger_last_discharge}
            data: {value: "{{ discharge_now|float(0) }}"}
          - action: input_number.set_value
            target: {entity_id: input_number.energy_battery_ledger_stock_kwh}
            data:
              value: >-
                {% set stock = stock_kwh|float(0) %}
                {% set charged = delta_charge|float(0) %}
                {% set discharged = delta_discharge|float(0) %}
                {{ [stock + charged - discharged, 0] | max }}
          - action: input_number.set_value
            target: {entity_id: input_number.energy_battery_ledger_stock_cost}
            data:
              value: >-
                {% set stock = stock_kwh|float(0) %}
                {% set cost = stock_cost|float(0) %}
                {% set charged = delta_charge|float(0) %}
                {% set discharged = delta_discharge|float(0) %}
                {% set charge_eff = charge_efficiency|float(0.9) %}
                {% set discharge_eff = discharge_efficiency|float(0.9) %}
                {% set charge_cost = charged * (grid_charge_share|float(0)) * (tariff|float(0)) / charge_eff %}
                {% set discharge_cost = (cost / stock * discharged / discharge_eff) if stock > 0.01 and discharge_eff > 0 else 0 %}
                {{ [cost + charge_cost - discharge_cost, 0] | max }}

  - id: energy_battery_ledger_initialize
    alias: Energy battery ledger initialize readings
    mode: single
    trigger:
      - platform: homeassistant
        event: start
    condition: []
    action:
      - action: input_number.set_value
        target: {entity_id: input_number.energy_battery_ledger_last_charge}
        data: {value: "{{ states('sensor.cerbo_gx_dc_battery_charge_energy') | float(0) }}"}
      - action: input_number.set_value
        target: {entity_id: input_number.energy_battery_ledger_last_discharge}
        data: {value: "{{ states('sensor.cerbo_gx_dc_battery_discharge_energy') | float(0) }}"}

