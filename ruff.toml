target-version = "py314"
line-length = 100
extend-exclude = ["reports"]

[lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
    "TID",  # flake8-tidy-imports
    "PL",   # pylint (curated below)
    "PT",   # flake8-pytest-style
]
ignore = [
    "E501",     # line length is checked, not enforced strictly across long SQL/docs
    "PLR0912",  # too many branches (coordinator has intentionally long branches)
    "PLR0913",  # too many arguments (dataclass constructors)
    "PLR0915",  # too many statements
    "PLR2004",  # magic value used in comparison (fine in tests)
    "SIM108",   # ternary preferred (readability, not correctness)
]

[lint.per-file-ignores]
# Tests intentionally use composite asserts, per-test HA-stub imports inside
# functions, and small helper classes with mutable class attributes.
"tests/*" = [
    "B011",
    "E701",
    "E702",
    "PLC0415",
    "PLR0911",
    "PT018",
    "RUF012",
    "RUF043",
    "PLR0124",
    "PLR1714",
]
# The native adapter's binding resolver has many small fail-closed branches
# and each one is its own explicit early return; splitting it hurts clarity.
"custom_components/solar_analytics/native_adapter.py" = ["PLR0911"]
# The coordinator imports its Home Assistant helpers at module top and its
# helpers use short guards.
"custom_components/solar_analytics/coordinator.py" = ["PLR0911"]
# validate_actual_state has 12 fail-closed early returns by design; each is a
# distinct diagnostic reason and consolidating them into a lookup would hide
# the intent.
"custom_components/solar_analytics/v2_metrics.py" = ["PLR0911"]
# storage_v2.py uses compact one-line SQL guards (``if x: return; …``)
# throughout. Reformatting to full multi-line for stylistic reasons alone
# would produce noisy churn in a file that is otherwise stable.
"custom_components/solar_analytics/storage_v2.py" = ["E701", "E702"]
# Local read-only report script that predates the reusability refactor;
# stylistic-only warnings are ignored here to keep it as-is.
"scripts/recorder_backfill_report.py" = ["PLR0124", "PLR1714"]

[format]
quote-style = "double"
indent-style = "space"
